---
name: YAML Checks

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use"
        required: false
        default: "3.x"
        type: string
      yamllint-config-filename:
        description: "Yamllint config filename"
        required: false
        default: "configs/yamllint.yaml"
        type: string

jobs:
  quality-gate:
    permissions:
      contents: read
      pull-requests: read
      # checks: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install yamllint
        run: |
          pip3 install yamllint
      - name: Lint YAML files
        id: yamllint
        env:
          YAMLLINT_CONFIG_FILE: ${{ inputs.yamllint-config-filename }}
        run: |
          yamllint .
      - name: Format and print GH step summary
        if: always()
        run: |
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|:--|:--|" >> $GITHUB_STEP_SUMMARY
          echo "| **yamllint** | ${{ steps.yamllint.outcome }} |" >> $GITHUB_STEP_SUMMARY
