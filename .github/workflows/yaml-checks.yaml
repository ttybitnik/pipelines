---
name: YAML Checks

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use"
        required: false
        default: "3.x"
        type: string
      yamllint-config-filename:
        description: "Yamllint config filename"
        required: false
        default: "configs/yamllint.yaml"
        type: string

jobs:
  quality-gate:
    permissions:
      contents: read
      pull-requests: read
      # checks: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548  # v6.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install yamllint
        run: |
          pip3 install yamllint
      - name: Lint YAML files
        id: yamllint
        env:
          YAMLLINT_CONFIG_FILE: ${{ inputs.yamllint-config-filename }}
        run: |
          yamllint .
      - name: Format and print GH step summary
        if: always()
        run: |
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|:--|:--|" >> $GITHUB_STEP_SUMMARY
          echo "| **yamllint** | ${{ steps.yamllint.outcome }} |" >> $GITHUB_STEP_SUMMARY
