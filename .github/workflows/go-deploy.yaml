---
name: Go Deploy

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      # go-version:
      #   description: "Go version to use"
      #   required: false
      #   default: "stable"
      #   type: string
      go-version-file:
        description: "Go version file to use"
        required: false
        default: "go.mod"
        type: string
      goreleaser-version:
        description: "Goreleaser version"
        required: false
        default: "latest"
        type: string
      goreleaser-args:
        description: "Goreleaser args"
        required: false
        default: "release --clean --config configs/goreleaser.yaml"
        type: string

jobs:
  goreleaser:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3  # v6.0.0
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c  # v.6.1.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
      - name: Build and release with goreleaser
        id: releaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a  # v6.4.0
        with:
          distribution: goreleaser
          version: ${{ inputs.goreleaser-version }}
          args: ${{ inputs.goreleaser-args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Format and print GH step summary
        if: always()
        run: |
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|:--|:--|" >> $GITHUB_STEP_SUMMARY
          echo "| **goreleaser** | ${{ steps.releaser.outcome }} |" >> $GITHUB_STEP_SUMMARY
