---
name: SecOps

on:  # yamllint disable-line rule:truthy
  workflow_call:

jobs:
  trivy:
    permissions:
      contents: read
      security-events: write
      # only required for workflows in private repositories
      # actions: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
      - name: Run Trivy scanner in fs mode for vuln and secret
        id: trivy-scan
        uses: aquasecurity/trivy-action@97e0b3872f55f89b95b2f65b3dbab56962816478  # v0.34.2
        with:
          scan-type: "fs"
          scanners: "vuln,secret"
          ignore-unfixed: true
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
      - name: Run Trivy scanner in fs mode for misconfig
        id: trivy-scan-misconfig
        uses: aquasecurity/trivy-action@97e0b3872f55f89b95b2f65b3dbab56962816478  # v0.34.2
        with:
          scan-type: "fs"
          scanners: "misconfig"
          ignore-unfixed: true
          format: "table"
          severity: "CRITICAL,HIGH"
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@0d579ffd059c29b07949a3cce3983f0780820c98  # v4.32.6
        with:
          sarif_file: "trivy-results.sarif"
      - name: Format and print GH step summary
        if: always()
        run: |
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|:--|:--|" >> $GITHUB_STEP_SUMMARY
          echo "| **trivy** | ${{ steps.trivy-scan.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **trivy_ignore_unfixed** | $TRIVY_IGNORE_UNFIXED  |" >> $GITHUB_STEP_SUMMARY
          echo "| **trivy_severity** | $TRIVY_SEVERITY  |" >> $GITHUB_STEP_SUMMARY
          echo "| **trivy_scanners** | $TRIVY_SCANNERS  |" >> $GITHUB_STEP_SUMMARY
