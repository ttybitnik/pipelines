---
name: SecOps

on:  # yamllint disable-line rule:truthy
  workflow_call:

jobs:
  trivy:
    permissions:
      contents: read
      security-events: write
      # only required for workflows in private repositories
      # actions: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Run Trivy scanner in fs mode for vuln and secret
        id: trivy-scan
        uses: aquasecurity/trivy-action@97e0b3872f55f89b95b2f65b3dbab56962816478  # v0.34.2
        with:
          scan-type: "fs"
          scanners: "vuln,secret"
          ignore-unfixed: true
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
      - name: Run Trivy scanner in fs mode for misconfig
        id: trivy-scan-misconfig
        uses: aquasecurity/trivy-action@97e0b3872f55f89b95b2f65b3dbab56962816478  # v0.34.2
        with:
          scan-type: "fs"
          scanners: "misconfig"
          ignore-unfixed: true
          format: "table"
          severity: "CRITICAL,HIGH"
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@cdefb33c0f6224e58673d9004f47f7cb3e328b89  # v4.31.10
        with:
          sarif_file: "trivy-results.sarif"
      - name: Format and print GH step summary
        if: always()
        run: |
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|:--|:--|" >> $GITHUB_STEP_SUMMARY
          echo "| **trivy** | ${{ steps.trivy-scan.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **trivy_ignore_unfixed** | $TRIVY_IGNORE_UNFIXED  |" >> $GITHUB_STEP_SUMMARY
          echo "| **trivy_severity** | $TRIVY_SEVERITY  |" >> $GITHUB_STEP_SUMMARY
          echo "| **trivy_scanners** | $TRIVY_SCANNERS  |" >> $GITHUB_STEP_SUMMARY
