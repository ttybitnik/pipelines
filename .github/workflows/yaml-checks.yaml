---
name: YAML Checks

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use"
        required: false
        default: "3.x"
        type: string
      yamllint-config-filename:
        description: "Yamllint config filename"
        required: false
        default: "configs/yamllint.yaml"
        type: string

jobs:
  quality-gate:
    permissions:
      contents: read
      pull-requests: read
      # checks: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install yamllint
        run: |
          pip3 install yamllint
      - name: Lint YAML files
        id: yamllint
        env:
          YAMLLINT_CONFIG_FILE: ${{ inputs.yamllint-config-filename }}
        run: |
          yamllint .
      - name: Format and print GH step summary
        if: always()
        run: |
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|:--|:--|" >> $GITHUB_STEP_SUMMARY
          echo "| **yamllint** | ${{ steps.yamllint.outcome }} |" >> $GITHUB_STEP_SUMMARY
