---
name: Go Deploy

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      # go-version:
      #   description: "Go version to use"
      #   required: false
      #   default: "stable"
      #   type: string
      go-version-file:
        description: "Go version file to use"
        required: false
        default: "go.mod"
        type: string
      goreleaser-version:
        description: "Goreleaser version"
        required: false
        default: "latest"
        type: string
      goreleaser-args:
        description: "Goreleaser args"
        required: false
        default: "release --clean --config configs/goreleaser.yaml"
        type: string

jobs:
  goreleaser:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v.6.5.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
      - name: Build and release with goreleaser
        id: releaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89  # v7.2.2
        with:
          distribution: goreleaser
          version: ${{ inputs.goreleaser-version }}
          args: ${{ inputs.goreleaser-args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Format and print GH step summary
        if: always()
        run: |
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|:--|:--|" >> $GITHUB_STEP_SUMMARY
          echo "| **goreleaser** | ${{ steps.releaser.outcome }} |" >> $GITHUB_STEP_SUMMARY
